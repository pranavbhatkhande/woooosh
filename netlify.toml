[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The previous app registered /sw.js. Keep it uncached so browsers
# pick up the script that deletes that offline cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
