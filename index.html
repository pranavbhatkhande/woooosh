<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>woooosh!</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="./manifest.json">
    <style>
        :root {
            --primary-bg: #FDF6FD;
            --card-bg: #FFFFFF;
            --primary-text: #4A4A6A;
            --secondary-text: #787890;
            --accent-main: #FF6B6B;
            --accent-main-hover: #FF4F4F;
            --accent-secondary: #4ECDC4;
            --accent-secondary-hover: #3AA9A1;
            --input-focus-border: var(--accent-main);
            --danger-color: #F746A2;
            --danger-hover: #D9006C;
            --status-idea: #FFD166;
            --status-action: #06D6A0;
            --status-inProgress: #118AB2;
            --status-scheduled: #7F5AF0;
            --status-reminder: #FF9F1C;
            --status-completed: #BFC0C0;
            --border-color: #EAEAF2;
            --shadow-small: 0 2px 4px rgba(74,74,106,0.1);
            --shadow-medium: 0 4px 8px rgba(74,74,106,0.12);
            --shadow-large: 0 6px 12px rgba(74,74,106,0.15);
        }

        body {
            font-family: 'Poppins', 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.65;
            background-color: var(--primary-bg);
            color: var(--primary-text);
            margin: 0;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px 35px;
            border-radius: 16px;
            box-shadow: var(--shadow-large);
            width: 100%;
            max-width: 780px;
        }

        /* MODIFIED HEADER AREA STYLES */
        .header-area {
            display: flex;
            align-items: center;
            justify-content: center; /* Center title and button */
            text-align: center;
            gap: 15px; /* Space between title and button */
            margin-bottom: 20px; 
            flex-wrap: wrap;
        }

        .header-area h1 {
            color: var(--accent-main);
            margin: 0;
            font-weight: 700;
            font-size: 3em;
            letter-spacing: -1px;
        }

        /* NEW STYLES FOR TOGGLE BUTTON */
        .how-to-toggle-button {
            background-color: var(--accent-secondary);
            color: white;
            border: none;
            border-radius: 20px; /* Pill shape */
            padding: 8px 18px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            white-space: nowrap;
        }

        .how-to-toggle-button:hover {
            background-color: var(--accent-secondary-hover);
            transform: translateY(-1px);
        }
        /* END NEW STYLES FOR TOGGLE BUTTON */

        /* MODIFIED STYLES FOR HOW-TO BOX (now toggleable) */
        .how-to-box {
            border: 2px solid var(--accent-secondary);
            border-radius: 10px;
            padding: 20px;
            background-color: #fff;
            width: 95%;
            max-width: 600px; /* Can be wider now */
            margin: 20px auto; /* Centered, with space above/below */
            font-size: 0.95em;
            box-shadow: var(--shadow-medium);
            color: var(--primary-text);
            /* transition: all 0.3s ease-in-out; /* Optional: for smoother show/hide if not using display:none */
        }
        
        .how-to-box.hidden {
            display: none;
        }

        .how-to-box h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--accent-main);
            font-size: 1.3em;
            font-weight: 600;
            text-align: center;
        }

        .how-to-box ol {
            padding-left: 25px;
            margin-bottom: 0;
        }

        .how-to-box li {
            margin-bottom: 8px;
            line-height: 1.6;
        }
        /* END MODIFIED STYLES FOR HOW-TO BOX */
        
        .input-area { /* (Existing styles from here down, ensure they are correct) */
            display: flex;
            margin-top: 25px; /* Adjusted margin-top if needed */
            margin-bottom: 30px;
            gap: 12px;
        }
        /* ... (rest of your existing CSS for .input-area, .task-filters, #deleteAllButton, task items, etc. should follow here) ... */
        /* (Copied from previous correct version to ensure completeness) */

        .input-area input[type="text"] {
            flex-grow: 1;
            padding: 15px 18px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1.05em;
        }
        .input-area input[type="text"]::placeholder {
            color: var(--secondary-text);
            opacity: 0.8;
        }
        .input-area input[type="text"]:focus {
            outline: none;
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.25);
        }

        .input-area button {
            padding: 15px 28px;
            background: linear-gradient(45deg, var(--accent-main), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.05em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: var(--shadow-medium);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-area button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-large);
        }
        
        .task-filters {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .task-filters button {
            padding: 10px 20px;
            background-color: var(--card-bg);
            color: var(--accent-secondary);
            border: 2px solid var(--accent-secondary);
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .task-filters button:hover {
            background-color: var(--accent-secondary);
            color: white;
            transform: translateY(-1px);
        }
        .task-filters button.active {
            background-color: var(--accent-secondary);
            color: white;
            border-color: var(--accent-secondary);
            box-shadow: var(--shadow-small);
        }

        #deleteAllButton {
            display: block; 
            margin: 15px auto 25px auto;
            padding: 10px 20px;
            background-color: var(--danger-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            text-transform: uppercase;
            box-shadow: var(--shadow-small);
            transition: background-color 0.3s, transform 0.2s;
        }

        #deleteAllButton:hover {
            background-color: var(--danger-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        ul#taskList { list-style-type: none; padding: 0; }

        li.task-item {
            background-color: var(--card-bg);
            padding: 20px 22px;
            border-left: 5px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: var(--shadow-medium);
            transition: box-shadow 0.3s, transform 0.2s;
        }
        li.task-item:hover {
            box-shadow: var(--shadow-large);
            transform: translateY(-2px);
        }
        li.task-item.status-idea { border-left-color: var(--status-idea); }
        li.task-item.status-action { border-left-color: var(--status-action); }
        li.task-item.status-inProgress { border-left-color: var(--status-inProgress); }
        li.task-item.status-scheduled { border-left-color: var(--status-scheduled); }
        li.task-item.status-completed { border-left-color: var(--status-completed); }
        
        .task-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start; 
            gap: 12px;
        }

        .task-text {
            flex-grow: 1;
            font-size: 1.1em; 
            color: var(--primary-text);
            word-break: break-word;
            line-height: 1.55;
        }
        
        .task-text.editing {
            border: 1px solid var(--input-focus-border);
            padding: 10px;
            border-radius: 6px;
            font-size: 1.05em; 
        }
        .task-text.status-completed {
            text-decoration: line-through;
            color: var(--secondary-text);
            opacity: 0.8;
        }

        .task-status {
            font-size: 0.8em;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            color: white;
            white-space: nowrap;
            align-self: flex-start; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-idea { background-color: var(--status-idea); color: #503E00; } 
        .status-action { background-color: var(--status-action); }
        .status-inProgress { background-color: var(--status-inProgress); }
        .status-scheduled { background-color: var(--status-scheduled); }
        .status-completed { background-color: var(--status-completed); color: #4A4A6A;}

        .task-actions {
            display: flex;
            flex-wrap: wrap; 
            gap: 10px; 
            align-items: center; 
            padding-top: 10px;
            border-top: 1px solid var(--border-color); 
            margin-top: 10px;
        }
        
        .task-actions button {
            padding: 9px 16px;
            border: none;
            border-radius: 8px; 
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease-in-out;
            color: white; 
            box-shadow: var(--shadow-small);
        }
        .task-actions button:hover {
            transform: translateY(-1px) scale(1.02);
            opacity: 0.9;
            box-shadow: var(--shadow-medium);
        }

        .task-actions .btn-edit { background-color: #FFAB00; }
        .task-actions .btn-save { background-color: #00C853; }
        .task-actions .btn-actionize { background-color: #2979FF; }
        .task-actions .btn-start { background-color: var(--status-inProgress); }
        .task-actions .btn-schedule { background-color: var(--status-scheduled); }
        .task-actions .btn-complete { background-color: var(--accent-secondary); }
        .task-actions .btn-delete { background-color: var(--danger-color); }
        
        .schedule-details {
            font-size: 0.9em;
            color: var(--secondary-text);
            padding: 8px 0;
            background-color: #FAF8FA;
            border-radius: 6px;
            text-align: center;
        }

        .schedule-input-area {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            align-items: center;
            padding: 12px;
            background-color: #FDF6FD; 
            border-radius: 8px;
        }
        .schedule-input-area input[type="datetime-local"] {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95em;
            flex-grow: 1;
        }
        .schedule-input-area input[type="datetime-local"]:focus {
             outline: none;
             border-color: var(--input-focus-border);
        }
        .schedule-input-area button {
            padding: 10px 18px;
            font-size: 0.9em;
            font-weight: 600;
            background-color: var(--accent-secondary); 
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }
        .schedule-input-area button:last-of-type { 
            background-color: var(--secondary-text);
        }
        .schedule-input-area button:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        .no-tasks {
            text-align: center;
            color: var(--secondary-text);
            padding: 35px 25px;
            font-style: italic;
            font-size: 1.15em;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-small);
        }

         li.task-item.status-reminder { border-left-color: var(--status-reminder); }
        .task-status.status-reminder { background-color: var(--status-reminder); color: #3D2600; }
        .task-actions .btn-reminder { background-color: var(--status-reminder); color: #3D2600; }

        /* Toast notifications */
        #toastContainer {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: var(--primary-text);
            color: white;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 0.92em;
            font-weight: 500;
            opacity: 0;
            transform: translateX(30px);
            transition: opacity 0.28s ease, transform 0.28s ease;
            max-width: 320px;
            box-shadow: var(--shadow-large);
            pointer-events: auto;
        }
        .toast.show { opacity: 1; transform: translateX(0); }
        .toast.toast-error { background: #c0392b; }
        .toast.toast-success { background: #1a9e68; }
        .toast.toast-info { background: var(--status-inProgress); }

        /* Animations */
        @keyframes taskSlideIn {
            from { opacity: 0; transform: translateY(-12px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0)    scale(1);    }
        }
        .task-item-new { animation: taskSlideIn 0.28s ease both; }

        @keyframes confettiFall {
            0%   { transform: translateY(0)     rotate(0deg);   opacity: 1; }
            100% { transform: translateY(220px) rotate(720deg); opacity: 0; }
        }

        @keyframes inputShake {
            0%,100% { transform: translateX(0); }
            20%     { transform: translateX(-6px); }
            40%     { transform: translateX(6px); }
            60%     { transform: translateX(-4px); }
            80%     { transform: translateX(4px); }
        }
        .input-shake { animation: inputShake 0.4s ease; }

        /* Filter count badge */
        .filter-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 19px;
            height: 19px;
            background-color: rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 0 5px;
            font-size: 0.78em;
            font-weight: 700;
            margin-left: 4px;
            vertical-align: middle;
        }
        .task-filters button.active .filter-count { background-color: rgba(255,255,255,0.45); }

        /* Stats bar */
        .stats-bar {
            text-align: center;
            font-size: 0.82em;
            color: var(--secondary-text);
            margin-bottom: 16px;
            letter-spacing: 0.3px;
        }
        .stats-bar strong { color: var(--accent-main); }

        @media (max-width: 700px) {
            body { padding: 12px; }
            .container { padding: 20px 16px; }
            .header-area {
                flex-direction: column;
                align-items: center;
            }
            .header-area h1 {
                text-align: center;
                width: 100%;
                margin-bottom: 10px; 
            }
            .how-to-toggle-button {
                margin-left: 0;
                margin-bottom: 15px;
            }
            .how-to-box {
                max-width: 100%;
                margin-top: 0;
            }
            .input-area {
                flex-direction: column;
            }
            .input-area input[type="text"],
            .input-area button {
                width: 100%;
                box-sizing: border-box;
            }
            .task-actions button {
                padding: 10px 14px;
                font-size: 0.85em;
            }
        }

    </style>
</head>
<body>

    <div class="container">

        <div class="header-area">
            <h1>woooosh!</h1>
            <button id="toggleHowToBtn" class="how-to-toggle-button">How to Woooosh?</button>
        </div>

        <div id="howToBox" class="how-to-box hidden"> <h3>How to Woooosh!</h3>
            <ol>
                <li>Capture Ideas 💡</li>
                <li>Turn ideas into actions ⚡</li>
                <li>Start working on them right away 🔥 <em>or</em> set a Reminder 🔔</li>
                <li>Only if you can't start now — Schedule them 📅</li>
                <li>Done? One woooosh! complete! ✅</li>
            </ol>
        </div>
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Woooosh in a new idea...">
            <button onclick="addTask()">Add</button>
        </div>
        
        <div class="task-filters">
            <button id="filterAll" class="active" onclick="setFilter('all')">All</button>
            <button id="filterIdea" onclick="setFilter('idea')">💡 Ideas</button>
            <button id="filterAction" onclick="setFilter('action')">⚡ Actions</button>
            <button id="filterInProgress" onclick="setFilter('inProgress')">🔥 Started</button>
            <button id="filterReminder" onclick="setFilter('reminder')">🔔 Reminders</button>
            <button id="filterScheduled" onclick="setFilter('scheduled')">📅 Scheduled</button>
            <button id="filterCompleted" onclick="setFilter('completed')">✅ Done</button>
        </div>

        <button id="deleteAllButton" onclick="deleteAllTasks()">Delete All Wooooshes</button>

        <ul id="taskList">
            </ul>
         <p id="noTasksMessage" class="no-tasks" style="display: none;">Nothing to woooosh about yet!</p>
    </div>

    <div id="toastContainer"></div>

    <script>
        let tasks = [];
        let currentFilter = 'all';
        let _editCancelled = false; // Flag for Escape-key cancel-without-save

        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        const noTasksMessage = document.getElementById('noTasksMessage');

        const toggleHowToBtn = document.getElementById('toggleHowToBtn');
        const howToBox = document.getElementById('howToBox');
        if (toggleHowToBtn && howToBox) {
            toggleHowToBtn.addEventListener('click', () => {
                howToBox.classList.toggle('hidden');
            });
        }

        // Enter key shortcut to add task
        taskInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // ── Toast notifications ─────────────────────────────────────────────
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => {
                requestAnimationFrame(() => toast.classList.add('show'));
            });
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 320);
            }, 3000);
        }

        // ── Confetti on task completion ──────────────────────────────────────
        function launchConfetti() {
            const colors = ['#FF6B6B','#4ECDC4','#FFD166','#7F5AF0','#06D6A0','#FF9F1C'];
            const container = document.querySelector('.container');
            const rect = container.getBoundingClientRect();
            for (let i = 0; i < 28; i++) {
                const piece = document.createElement('div');
                const size = Math.random() * 9 + 5;
                piece.style.cssText = [
                    'position:fixed',
                    `width:${size}px`,
                    `height:${size}px`,
                    `background:${colors[Math.floor(Math.random() * colors.length)]}`,
                    `left:${rect.left + Math.random() * rect.width}px`,
                    `top:${rect.top + 60}px`,
                    `border-radius:${Math.random() > 0.5 ? '50%' : '2px'}`,
                    'pointer-events:none',
                    'z-index:9999',
                    `animation:confettiFall ${(Math.random() * 0.8 + 0.7).toFixed(2)}s ease-out forwards`,
                    `animation-delay:${(Math.random() * 0.3).toFixed(2)}s`
                ].join(';');
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 2200);
            }
        }

        // ── Persistence ──────────────────────────────────────────────────────
        function saveTasks() {
            // Strip transient _isNew flag before persisting
            const toSave = tasks.map(({ _isNew, ...rest }) => rest);
            localStorage.setItem('wooooshTasks', JSON.stringify(toSave));
        }

        function loadTasks() {
            const stored = localStorage.getItem('wooooshTasks');
            if (stored) {
                tasks = JSON.parse(stored);
                tasks.forEach(t => { t.isEditing = false; t.isScheduling = false; });
            }
        }

        // ── Filter ───────────────────────────────────────────────────────────
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.task-filters button').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById('filter' + filter.charAt(0).toUpperCase() + filter.slice(1));
            if (btn) btn.classList.add('active');
            renderTasks();
        }

        // ── CRUD ─────────────────────────────────────────────────────────────
        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') {
                taskInput.classList.remove('input-shake');
                void taskInput.offsetWidth; // reflow to restart animation
                taskInput.classList.add('input-shake');
                taskInput.addEventListener('animationend', () => taskInput.classList.remove('input-shake'), { once: true });
                showToast('Please woooosh in some text first!', 'error');
                taskInput.focus();
                return;
            }
            const newTask = {
                id: Date.now(),
                text,
                status: 'idea',
                created: new Date().toISOString(),
                scheduledFor: null,
                isEditing: false,
                isScheduling: false,
                _isNew: true
            };
            tasks.unshift(newTask);
            taskInput.value = '';
            saveAndRender();
        }

        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this woooosh?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveAndRender();
            }
        }

        function deleteAllTasks() {
            if (tasks.length === 0) {
                showToast('There are no wooooshes to delete!', 'info');
                return;
            }
            if (confirm('Are you sure you want to delete ALL wooooshes? This action cannot be undone.')) {
                tasks = [];
                saveAndRender();
            }
        }

        // ── Edit ─────────────────────────────────────────────────────────────
        function toggleEdit(id) {
            // BUG FIX: added {} so both statements are inside the if
            tasks.forEach(t => { if (t.id !== id) { t.isEditing = false; t.isScheduling = false; } });
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.isEditing = !task.isEditing;
                saveAndRender();
                if (task.isEditing) {
                    setTimeout(() => {
                        const el = document.querySelector(`.task-item[data-id='${id}'] .task-text.editing`);
                        if (el) el.focus();
                    }, 0);
                }
            }
        }

        function handleEditBlur(id, value) {
            if (_editCancelled) {
                _editCancelled = false;
                cancelEdit(id);
            } else {
                updateTaskText(id, value);
            }
        }

        function cancelEdit(id) {
            // Close edit mode without saving (used by Escape key)
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.isEditing = false;
                saveAndRender();
            }
        }

        function updateTaskText(id, newText) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                const trimmed = newText.trim();
                if (trimmed === '') {
                    showToast('Woooosh text cannot be empty.', 'error');
                    task.isEditing = true;
                } else {
                    task.text = trimmed;
                    task.isEditing = false;
                }
                saveAndRender();
            }
        }

        // ── Status changes ───────────────────────────────────────────────────
        function changeStatus(id, newStatus) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.status = newStatus;
                task.isEditing = false;
                task.isScheduling = false;
                if (newStatus !== 'scheduled') task.scheduledFor = null;
                saveAndRender();
                if (newStatus === 'completed') {
                    launchConfetti();
                    showToast('Woooosh! Task completed! 🎉', 'success');
                }
            }
        }

        // ── Scheduling ───────────────────────────────────────────────────────
        function openScheduleInterface(id) {
            // BUG FIX: added {} so both statements are inside the if
            tasks.forEach(t => { if (t.id !== id) { t.isScheduling = false; t.isEditing = false; } });
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.isScheduling = true;
                saveAndRender();
            }
        }

        function confirmSchedule(id, datetimeValue) {
            const task = tasks.find(t => t.id === id);
            if (task && datetimeValue) {
                task.status = 'scheduled';
                task.scheduledFor = new Date(datetimeValue).toISOString();
                task.isScheduling = false;
                saveAndRender();
                showToast('Woooosh scheduled! 📅', 'success');
            } else if (task && !datetimeValue) {
                showToast('Please select a date and time for your woooosh.', 'error');
            }
        }

        function cancelScheduling(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.isScheduling = false;
                saveAndRender();
            }
        }

        // ── Render ───────────────────────────────────────────────────────────
        function saveAndRender() {
            saveTasks();
            renderTasks();
        }

        function updateFilterBadges() {
            const counts = { all: tasks.length, idea: 0, action: 0, inProgress: 0, reminder: 0, scheduled: 0, completed: 0 };
            tasks.forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });
            const map = {
                all:        ['filterAll',        'All'],
                idea:       ['filterIdea',       '💡 Ideas'],
                action:     ['filterAction',     '⚡ Actions'],
                inProgress: ['filterInProgress', '🔥 Started'],
                reminder:   ['filterReminder',   '🔔 Reminders'],
                scheduled:  ['filterScheduled',  '📅 Scheduled'],
                completed:  ['filterCompleted',  '✅ Done'],
            };
            Object.entries(map).forEach(([status, [btnId, label]]) => {
                const btn = document.getElementById(btnId);
                if (!btn) return;
                const n = counts[status] || 0;
                btn.innerHTML = n > 0 ? `${label} <span class="filter-count">${n}</span>` : label;
            });
        }

        function renderTasks() {
            taskList.innerHTML = '';

            const filteredTasks = tasks.filter(task => {
                if (currentFilter === 'all') return true;
                return task.status === currentFilter;
            }).sort((a, b) => {
                if (a.status === 'completed' && b.status !== 'completed') return 1;
                if (a.status !== 'completed' && b.status === 'completed') return -1;
                return new Date(b.created) - new Date(a.created);
            });

            updateFilterBadges();

            if (tasks.length === 0) {
                noTasksMessage.textContent = 'Nothing to woooosh about yet! Add your first idea. 💡';
                noTasksMessage.style.display = 'block';
                taskList.style.display = 'none';
            } else if (filteredTasks.length === 0) {
                noTasksMessage.textContent = 'No wooooshes in this view. Try a different filter!';
                noTasksMessage.style.display = 'block';
                taskList.style.display = 'none';
            } else {
                noTasksMessage.style.display = 'none';
                taskList.style.display = 'block';
            }

            filteredTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item status-${task.status}${task._isNew ? ' task-item-new' : ''}`;
                li.dataset.id = task.id;
                if (task._isNew) task._isNew = false; // clear after first render

                let taskHTML = `<div class="task-content">`;

                if (task.isEditing) {
                    taskHTML += `<input type="text" class="task-text editing" value="${escapeHTML(task.text)}"
                        onkeydown="if(event.key==='Enter'){_editCancelled=false;this.blur();}else if(event.key==='Escape'){event.preventDefault();_editCancelled=true;this.blur();}"
                        onblur="handleEditBlur(${task.id},this.value)">`;
                } else {
                    taskHTML += `<span class="task-text ${task.status === 'completed' ? 'status-completed' : ''}">${escapeHTML(task.text)}</span>`;
                }

                taskHTML += `<span class="task-status status-${task.status}">${getFriendlyStatus(task.status)}</span></div>`;

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'task-actions';

                if (!task.isEditing) {
                    actionsDiv.innerHTML += `<button class="btn-edit" onclick="toggleEdit(${task.id})">Edit</button>`;
                } else {
                    actionsDiv.innerHTML += `<button class="btn-save" onclick="updateTaskText(${task.id},this.closest('.task-item').querySelector('.task-text.editing').value)">Save</button>`;
                }

                if (task.status === 'idea') {
                    actionsDiv.innerHTML += `<button class="btn-actionize" onclick="changeStatus(${task.id},'action')">⚡ Actionize</button>`;
                }
                if (task.status === 'action' && !task.isScheduling) {
                    actionsDiv.innerHTML += `<button class="btn-start" onclick="changeStatus(${task.id},'inProgress')">🔥 Start Now</button>`;
                    actionsDiv.innerHTML += `<button class="btn-reminder" onclick="changeStatus(${task.id},'reminder')">🔔 Reminder</button>`;
                    actionsDiv.innerHTML += `<button class="btn-schedule" onclick="openScheduleInterface(${task.id})">📅 Schedule</button>`;
                }
                if (task.status === 'inProgress' && !task.isScheduling) {
                    actionsDiv.innerHTML += `<button class="btn-complete" onclick="changeStatus(${task.id},'completed')">✅ Complete</button>`;
                    actionsDiv.innerHTML += `<button class="btn-schedule" onclick="openScheduleInterface(${task.id})">📅 Schedule</button>`;
                }
                if (task.status === 'reminder') {
                    actionsDiv.innerHTML += `<button class="btn-start" onclick="changeStatus(${task.id},'inProgress')">🔥 Start Now</button>`;
                    actionsDiv.innerHTML += `<button class="btn-complete" onclick="changeStatus(${task.id},'completed')">✅ Complete</button>`;
                }
                if (task.status === 'scheduled' && !task.isScheduling) {
                    actionsDiv.innerHTML += `<button class="btn-start" onclick="changeStatus(${task.id},'inProgress')">🔥 Start Now</button>`;
                    actionsDiv.innerHTML += `<button class="btn-complete" onclick="changeStatus(${task.id},'completed')">✅ Complete</button>`;
                    actionsDiv.innerHTML += `<button class="btn-schedule" onclick="openScheduleInterface(${task.id})">📅 Reschedule</button>`;
                }
                if (task.status === 'completed') {
                    actionsDiv.innerHTML += `<button class="btn-actionize" onclick="changeStatus(${task.id},'action')">↩ Re-open</button>`;
                }

                if (!task.isEditing && !task.isScheduling) {
                    actionsDiv.innerHTML += `<button class="btn-delete" onclick="deleteTask(${task.id})">Delete</button>`;
                }

                taskHTML += actionsDiv.outerHTML;

                if (task.status === 'scheduled' && task.scheduledFor && !task.isScheduling) {
                    taskHTML += `<div class="schedule-details">📅 Scheduled: ${new Date(task.scheduledFor).toLocaleString()}</div>`;
                }

                if (task.isScheduling) {
                    const now = new Date();
                    const ref = task.scheduledFor ? new Date(task.scheduledFor) : new Date(now.getTime() + 3600000);
                    const pad = n => String(n).padStart(2, '0');
                    const defaultDT = `${ref.getFullYear()}-${pad(ref.getMonth()+1)}-${pad(ref.getDate())}T${pad(ref.getHours())}:${pad(ref.getMinutes())}`;
                    taskHTML += `
                        <div class="schedule-input-area">
                            <input type="datetime-local" id="scheduleTime-${task.id}" value="${defaultDT}">
                            <button onclick="confirmSchedule(${task.id},document.getElementById('scheduleTime-${task.id}').value)">Set</button>
                            <button onclick="cancelScheduling(${task.id})">Cancel</button>
                        </div>`;
                }

                li.innerHTML = taskHTML;
                taskList.appendChild(li);
            });
        }

        function getFriendlyStatus(status) {
            const map = {
                'idea':       '💡 Idea',
                'action':     '⚡ Action!',
                'inProgress': '🔥 Doing It!',
                'reminder':   '🔔 Reminder',
                'scheduled':  '📅 Scheduled',
                'completed':  '✅ Woooosh\'d!'
            };
            return map[status] || status;
        }

        function escapeHTML(str) {
            const p = document.createElement('p');
            p.textContent = str;
            return p.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            renderTasks();
        });

        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('woooosh ServiceWorker registered, scope:', reg.scope))
                    .catch(err => console.log('woooosh ServiceWorker registration failed:', err));
            });
        }
    </script>

</body>
</html>
